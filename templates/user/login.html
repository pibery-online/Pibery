{% extends 'base.html' %}

{% block title %}লগইন - Pibery{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0"><i class="fa-solid fa-right-to-bracket me-2"></i>লগইন করুন</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('main.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">ইমেইল এড্রেস</label>
                        <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">পাসওয়ার্ড</label>
                        <input type="password" name="password" class="form-control" required placeholder="********">
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">লগইন</button>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <span>নতুন ব্যবহারকারী? <a href="{{ url_for('main.register') }}" class="text-primary fw-bold">রেজিস্ট্রেশন করুন</a></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
