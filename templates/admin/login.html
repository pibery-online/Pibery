{% extends 'base.html' %}
{% block title %}এডমিন লগইন - Pibery{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0">Pibery Admin Panel</h4>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('main.admin_login') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">ইমেইল এড্রেস</label>
                            <input type="email" name="email" class="form-control" required placeholder="admin@pibery.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">পাসওয়ার্ড</label>
                            <input type="password" name="password" class="form-control" required placeholder="******">
                        </div>
                        <button type="submit" class="btn btn-dark w-100 mt-3">লগইন করুন</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
